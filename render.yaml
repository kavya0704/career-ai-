services:
  - type: web
    name: career-ai-scraper
    env: python
    rootDir: apps/scraper
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SCRAPER_SERVICE_API_KEY
        sync: false
